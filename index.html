<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Balancing Diamonds</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8fb;
        color: #111827;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        color: #4b5563;
      }
      .error {
        margin-top: 0.75rem;
        color: #b91c1c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Balancing Diamonds</h1>
      <p>The official website is live at balancingdiamonds.com.</p>
      <p id="domain-error" class="error" hidden></p>
    </main>
    <script>
      (function () {
        const allowedHosts = new Set([
          "balancingdiamonds.com",
          "www.balancingdiamonds.com",
          "localhost",
          "127.0.0.1",
        ]);

        if (!allowedHosts.has(window.location.hostname)) {
          const errorNode = document.getElementById("domain-error");
          errorNode.textContent =
            "Error: The site is configured for balancingdiamonds.com. Please verify domain and DNS settings.";
          errorNode.hidden = false;
        }
      })();
    </script>
  </body>
</html>
